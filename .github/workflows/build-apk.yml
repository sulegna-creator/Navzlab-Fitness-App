name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build:web

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@6.0.0 @capacitor/core@6.0.0 @capacitor/android@6.0.0

      - name: Recreate Android Project
        run: |
          mkdir -p tmp_config
          cp android/app/google-services.json tmp_config/google-services.json || echo "No Firebase"
          rm -rf android
          npx cap add android
          cp tmp_config/google-services.json android/app/google-services.json || echo "No Copy"

      - name: Force App Identity & AdMob Fix
        run: |
          # 1. Fix the App Name in strings.xml
          sed -i 's/app_name">.*</app_name">NAVZLAB Health</' android/app/src/main/res/values/strings.xml
          sed -i 's/title_activity_main">.*</title_activity_main">NAVZLAB Health</' android/app/src/main/res/values/strings.xml
          
          # 2. Inject AdMob ID (CRASH FIX)
          # This version replaces the </application> tag with the AdMob metadata + the tag
          sed -i 's/<\/application>/    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAVZLAB-Success-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk
