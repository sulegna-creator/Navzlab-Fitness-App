name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          # Ensure critical mobile packages are present
          npm install @capacitor-community/admob@6.0.0 canvas-confetti@1.9.3

      - name: Build Web Project
        run: npm run build:web

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@6.0.0 @capacitor/core@6.0.0 @capacitor/android@6.0.0

      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Surgical AdMob & Android 11 Fix
        run: |
          # 1. Force the App Name in strings.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">NAVZLAB Health</string><string name="title_activity_main">NAVZLAB Health</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # 2. Inject AdMob ID and Cleartext Traffic (Crash/Network Fix)
          # We add cleartext traffic so it can talk to your Render server
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # We inject the AdMob ID before the end of the application tag
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APP
