name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor-community/admob@6.0.0 canvas-confetti@1.9.3

      - name: Build Web Project
        run: npm run build:web

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@6.0.0 @capacitor/core@6.0.0 @capacitor/android@6.0.0

      - name: Recreate Android Project
        run: |
          mkdir -p tmp_config
          cp android/app/google-services.json tmp_config/google-services.json || echo "No Firebase"
          rm -rf android
          npx cap add android
          cp tmp_config/google-services.json android/app/google-services.json || echo "No Copy"

      - name: Clean Identity & Crash Fix
        run: |
          # 1. Force the App Name into the strings file
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">NAVZLAB Health</string><string name="title_activity_main">NAVZLAB Health</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # 2. Inject AdMob ID (The safest way possible)
          # This replaces the opening <application tag with the tag + the AdMob ID
          sed -i 's/<application/<application>\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>/' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAVZLAB-STABLE-BUILD
          path: android/app/build/outputs/apk/debug/app-debug.apk
