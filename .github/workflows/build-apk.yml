name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build:web

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@6.0.0 @capacitor/core@6.0.0 @capacitor/android@6.0.0

      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Surgical AdMob & Identity Fix
        run: |
          # 1. Force the App Name
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">NAVZLAB Health</string><string name="title_activity_main">NAVZLAB Health</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # 2. Crash Fix: Inject AdMob ID and Cleartext Traffic
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' android/app/src/main/AndroidManifest.xml
          
          # 3. Android 11 Fix: Queries
          sed -i '/<\/manifest>/i \    <queries><package android:name="com.android.vending" /><\/queries>' android/app/src/main/AndroidManifest.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAVZLAB-STABLE-FIX
          path: android/app/build/outputs/apk/debug/app-debug.apk
