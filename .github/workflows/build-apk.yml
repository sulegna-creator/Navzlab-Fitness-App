name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/splash-screen@6.0.0

      - name: Build Web Project
        run: npm run build:web

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@6.0.0 @capacitor/core@6.0.0 @capacitor/android@6.0.0

      - name: Rebuild Android Project
        run: |
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/xml
          echo '{"project_info":{"project_number":"410660970265","project_id":"shaped-xylopolist-5q6d2","storage_bucket":"shaped-xylopolist-5q6d2.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:410660970265:android:b7204c338873ee14cefb017b","android_client_info":{"package_name":"com.navzlab.fitnessapp"}},"api_key":[{"current_key":"AIzaSyDCPDplwnlrhPpNQPoQjcxHP5yWfZw6uVg"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"410660970265-t5k6td8q6j3882n0b1ia61st332hc8ea.apps.googleusercontent.com","client_type":3}]}}}]}' > android/app/google-services.json

      - name: Android 11 Network & AdMob Fix
        run: |
          # Force App Name
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">NAVZLAB Health</string><string name="title_activity_main">NAVZLAB Health</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # Inject Network Security and AdMob ID
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <queries><package android:name="com.android.vending" /><\/queries>' android/app/src/main/AndroidManifest.xml

      - name: Final Asset Sync
        run: |
          npx cap copy android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAVZLAB-PROCEED-FIX
          path: android/app/build/outputs/apk/debug/app-debug.apk
