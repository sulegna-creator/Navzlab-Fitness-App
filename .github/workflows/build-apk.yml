name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Recreate Android Project
        run: |
          # 1. Save your Firebase file to a temporary location
          mkdir -p tmp_config
          cp android/app/google-services.json tmp_config/google-services.json || echo "No Firebase file yet"
          
          # 2. Delete the hollow folder so Capacitor can build a real one
          rm -rf android
          
          # 3. Create the real Android project (this creates 'gradlew')
          npx cap add android
          
          # 4. Put your Firebase file into the real project
          cp tmp_config/google-services.json android/app/google-services.json || echo "Skipping Firebase copy"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
