name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor-community/admob@6.0.0 canvas-confetti@1.9.3

      - name: Build Web Project
        run: npm run build:web

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@6.0.0 @capacitor/core@6.0.0 @capacitor/android@6.0.0

      - name: Recreate Android Project
        run: |
          mkdir -p tmp_config
          cp android/app/google-services.json tmp_config/google-services.json || echo "No Firebase"
          rm -rf android
          npx cap add android
          cp tmp_config/google-services.json android/app/google-services.json || echo "No Copy"

      - name: Surgical AdMob & Identity Fix
        run: |
          # 1. Force the App Name safely
          sed -i 's/app_name">.*</app_name">NAVZLAB Health</' android/app/src/main/res/values/strings.xml
          
          # 2. Crash Fix: Inject AdMob ID using a safer "Append" method
          # This finds the </application> tag and places the AdMob ID right before it.
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' android/app/src/main/AndroidManifest.xml
          
          # 3. Android 11 Fix: Inject the <queries> tag right before the closing </manifest> tag
          sed -i '/<\/manifest>/i \    <queries><package android:name="com.android.vending" /><\/queries>' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAVZLAB-SURGICAL-FIX
          path: android/app/build/outputs/apk/debug/app-debug.apk
