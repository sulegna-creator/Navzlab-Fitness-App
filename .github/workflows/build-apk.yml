name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          # 1. Clean install based on package.json
          npm install
          
          # 2. Force-fix missing modules that caused previous errors
          npm install canvas-confetti@1.9.3 @tailwindcss/vite@4.0.0 @capacitor-community/admob@6.0.0

      - name: Build Web Project
        run: npm run build:web

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@6.0.0 @capacitor/core@6.0.0 @capacitor/android@6.0.0

      - name: Recreate Android Project
        run: |
          # Save your Firebase config to a safe spot
          mkdir -p tmp_config
          cp android/app/google-services.json tmp_config/google-services.json || echo "No Firebase file found"
          
          # Wipe the hollow folder and rebuild it properly
          rm -rf android
          npx cap add android
          
          # Put your Firebase file back into the fresh folder
          cp tmp_config/google-services.json android/app/google-services.json || echo "Skipping copy"

      - name: Inject AdMob App ID
        run: |
          # This injects the ID into the Manifest to prevent the "Auto-Close" crash
          sed -i 's/<application/<application>\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>/' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-app-final-version
          path: android/app/build/outputs/apk/debug/app-debug.apk
